[package]
name = "vrd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
ffmpeg-sys-next = { version = "9.1.1", default-features = false, features = ["avcodec", "swscale"] }
hex = "0.4.3"
hyprvr-proto = { version = "0.1.0", path = "../proto" }
libc = "0.2.191"
postcard = { version = "1.2.0", features = ["use-std"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10.4"
rustix = { version = "1.1.6", features = ["fs", "mm", "shm", "time", "event", "system", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
