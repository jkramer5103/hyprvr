[package]
name = "hyprvr-probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
ffmpeg-sys-next = { version = "9.1.1", default-features = false, features = ["avcodec", "swscale"] }
hyprvr-proto = { version = "0.1.0", path = "../proto" }
libc = "0.2.191"
png = "0.18.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.54.1", features = ["full"] }
