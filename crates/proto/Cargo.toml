[package]
name = "hyprvr-proto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hex = "0.4.3"
hmac = "0.13.0"
postcard = { version = "1.2.0", features = ["use-std"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10.4"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
spake2 = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util"] }
tracing = "0.1.44"
zstd = "0.14.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
